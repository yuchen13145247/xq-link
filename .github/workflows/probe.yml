name: probe
on: [workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: env
        run: |
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y clang lld
          which clang ld64.lld
      - name: sdk
        run: |
          set -x
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks && git sparse-checkout set iPhoneOS16.5.sdk
          du -sh iPhoneOS16.5.sdk
          SDK=$PWD/iPhoneOS16.5.sdk
          ls -l $SDK/usr/lib/libobjc.tbd $SDK/usr/lib/libSystem.tbd
          ls -l $SDK/System/Library/Frameworks/UIKit.framework/UIKit.tbd
          ls $SDK/usr/include/c++/v1 | head -3
      - name: build-hello
        run: |
          set -x
          SDK=/tmp/sdks/iPhoneOS16.5.sdk
          printf '#import <UIKit/UIKit.h>\nint main(int c,char**v){@autoreleasepool{(void)NSStringFromClass([UIView class]);return 0;}}\n' > /tmp/main.m
          clang -target arm64-apple-ios15.0 -isysroot $SDK -fobjc-arc -O2 -c /tmp/main.m -o /tmp/main.o
          ld64.lld -arch arm64 -platform_version ios 15.0 15.0 -syslibroot $SDK -o /tmp/hello /tmp/main.o -framework UIKit -framework Foundation -lobjc
          ls -l /tmp/hello
      - name: build-cpp
        run: |
          set -x
          SDK=/tmp/sdks/iPhoneOS16.5.sdk
          printf '#include <string>\n#include <vector>\nstd::string f(){return std::string("ok");}\n' > /tmp/t.cpp
          clang++ -target arm64-apple-ios15.0 -isysroot $SDK -std=c++17 -O2 -c /tmp/t.cpp -o /tmp/t.o && echo CPP_OK